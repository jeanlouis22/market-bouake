<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon compte | Market Bouaké</title>

    <style>

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }

        body {

            font-family: Arial, sans-serif;

            background: #f5f7f6;

            color: #17211b;

            min-height: 100vh;

        }

        header {

            background: #0b6b43;

            color: white;

            padding: 18px 20px;

            text-align: center;

        }

        header h1 {

            font-size: 22px;

        }

        .container {

            width: 100%;

            max-width: 650px;

            margin: 30px auto;

            padding: 20px;

        }

        .card {

            background: white;

            border-radius: 18px;

            padding: 28px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);

        }

        .profile {

            text-align: center;

            margin-bottom: 28px;

        }

        .avatar {

            width: 80px;

            height: 80px;

            margin: auto;

            border-radius: 50%;

            background: #0b6b43;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 34px;

        }

        #fullName {

            margin-top: 14px;

            font-size: 24px;

        }

        .subtitle {

            margin-top: 6px;

            color: #6b7280;

        }

        .info {

            margin-top: 20px;

        }

        .info-row {

            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 15px 0;

            border-bottom: 1px solid #e5e7eb;

        }

        .info-label {

            font-weight: bold;

        }

        .info-value {

            text-align: right;

            color: #374151;

            word-break: break-word;

        }

        .status {

            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            background: #e8f5ee;

            color: #0b6b43;

            font-weight: bold;

        }

        .logout {

            width: 100%;

            margin-top: 28px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #c62828;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        .logout:hover {

            opacity: 0.9;

        }

        #message {

            text-align: center;

            margin-top: 15px;

            font-weight: bold;

        }

        .loading {

            text-align: center;

            color: #6b7280;

            padding: 20px;

        }

        @media (max-width: 600px) {

            .container {

                padding: 15px;

            }

            .card {

                padding: 22px;

            }

            .info-row {

                display: block;

            }

            .info-value {

                text-align: left;

                margin-top: 5px;

            }

        }

    </style>

</head>

<body>

<header>

    <h1>🛒 Market Bouaké</h1>

</header>

<div class="container">

    <div class="card">

        <div

            id="loading"

            class="loading"

        >

            Chargement de votre compte...

        </div>

        <div

            id="accountContent"

            style="display:none;"

        >

            <div class="profile">

                <div class="avatar">

                    👤

                </div>

                <h2 id="fullName"></h2>

                <p

                    id="accountType"

                    class="subtitle"

                ></p>

            </div>

            <div class="info">

                <div class="info-row">

                    <span class="info-label">

                        Email

                    </span>

                    <span

                        id="email"

                        class="info-value"

                    ></span>

                </div>

                <div class="info-row">

                    <span class="info-label">

                        Téléphone

                    </span>

                    <span

                        id="phone"

                        class="info-value"

                    ></span>

                </div>

                <div class="info-row">

                    <span class="info-label">

                        Genre

                    </span>

                    <span

                        id="gender"

                        class="info-value"

                    ></span>

                </div>

                <div class="info-row">

                    <span class="info-label">

                        Date de naissance

                    </span>

                    <span

                        id="birthDate"

                        class="info-value"

                    ></span>

                </div>

                <div class="info-row">

                    <span class="info-label">

                        Rôle

                    </span>

                    <span

                        id="role"

                        class="info-value"

                    ></span>

                </div>

                <div class="info-row">

                    <span class="info-label">

                        Statut vendeur

                    </span>

                    <span

                        id="sellerStatus"

                        class="info-value"

                    ></span>

                </div>

            </div>

            <button

                id="logoutButton"

                class="logout"

            >

                Se déconnecter

            </button>

            <p id="message"></p>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// ============================================

// MARKET BOUAKÉ

// SUPABASE

// ============================================

const SUPABASE_URL =

    "https://qgdxxrnsiyzbacxxfdrg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =

    "sb_publishable_QE2in_ocTQQDEt0HW9wSCg_PKSzqo7N";

const supabaseClient =

    window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_PUBLISHABLE_KEY

    );

// ============================================

// CHARGER LE COMPTE

// ============================================

async function loadAccount() {

    const loading =

        document.getElementById("loading");

    const accountContent =

        document.getElementById("accountContent");

    // ----------------------------------------

    // RÉCUPÉRER L'UTILISATEUR CONNECTÉ

    // ----------------------------------------

    const {

        data: authData,

        error: authError

    } =

        await supabaseClient.auth.getUser();

    if (authError || !authData.user) {

        window.location.href =

            "connexion.html";

        return;

    }

    const user =

        authData.user;

    console.log(

        "Utilisateur connecté :",

        user

    );

    // ----------------------------------------

    // RÉCUPÉRER LE PROFIL

    // ----------------------------------------

    const {

        data: profile,

        error: profileError

    } =

        await supabaseClient

            .from("profiles")

            .select(

                "id, first_name, last_name, email, phone, gender, birth_date, role, seller_status"

            )

            .eq("id", user.id)

            .single();

    if (profileError) {

        console.error(

            "Erreur récupération profil :",

            profileError

        );

        loading.textContent =

            "Impossible de charger votre profil.";

        return;

    }

    console.log(

        "Profil récupéré :",

        profile

    );

    // ----------------------------------------

    // NOM COMPLET

    // ----------------------------------------

    const firstName =

        profile.first_name || "";

    const lastName =

        profile.last_name || "";

    const fullName =

        (firstName + " " + lastName).trim();

    document.getElementById(

        "fullName"

    ).textContent =

        fullName || "Utilisateur Market Bouaké";

    // ----------------------------------------

    // TYPE DE COMPTE

    // ----------------------------------------

    if (profile.role === "seller") {

        document.getElementById(

            "accountType"

        ).textContent =

            "Compte vendeur";

    } else {

        document.getElementById(

            "accountType"

        ).textContent =

            "Compte acheteur";

    }

    // ----------------------------------------

    // INFORMATIONS

    // ----------------------------------------

    document.getElementById(

        "email"

    ).textContent =

        profile.email || user.email || "Non renseigné";

    document.getElementById(

        "phone"

    ).textContent =

        profile.phone || "Non renseigné";

    document.getElementById(

        "gender"

    ).textContent =

        profile.gender || "Non renseigné";

    document.getElementById(

        "birthDate"

    ).textContent =

        profile.birth_date || "Non renseignée";

    document.getElementById(

        "role"

    ).textContent =

        profile.role || "Non défini";

    // ----------------------------------------

    // STATUT VENDEUR

    // ----------------------------------------

    const sellerStatus =

        document.getElementById(

            "sellerStatus"

        );

    sellerStatus.textContent =

        profile.seller_status || "not_seller";

    sellerStatus.className =

        "info-value status";

    // ----------------------------------------

    // AFFICHER LE COMPTE

    // ----------------------------------------

    loading.style.display =

        "none";

    accountContent.style.display =

        "block";

}

// ============================================

// DÉCONNEXION

// ============================================

document

    .getElementById("logoutButton")

    .addEventListener(

        "click",

        async function() {

            const button =

                document.getElementById(

                    "logoutButton"

                );

            button.disabled =

                true;

            button.textContent =

                "Déconnexion...";

            const {

                error

            } =

                await supabaseClient.auth.signOut();

            if (error) {

                console.error(

                    "Erreur déconnexion :",

                    error

                );

                document.getElementById(

                    "message"

                ).textContent =

                    "Erreur lors de la déconnexion.";

                button.disabled =

                    false;

                button.textContent =

                    "Se déconnecter";

                return;

            }

            window.location.href =

                "connexion.html";

        }

    );

// ============================================

// DÉMARRAGE

// ============================================

loadAccount();

</script>

</body>

</html>
