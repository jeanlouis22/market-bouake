<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon compte | Market Bouaké</title>

    <style>

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }

        body {

            font-family: Arial, sans-serif;

            background: #f5f7f6;

            color: #17211b;

            min-height: 100vh;

        }

        header {

            background: #0b6b43;

            color: white;

            padding: 18px 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }

        header h1 {

            font-size: 21px;

        }

        .container {

            max-width: 700px;

            margin: 30px auto;

            padding: 20px;

        }

        .card {

            background: white;

            border-radius: 18px;

            padding: 25px;

            box-shadow: 0 8px 25px rgba(0,0,0,0.07);

        }

        .profile {

            text-align: center;

            margin-bottom: 25px;

        }

        .avatar {

            width: 75px;

            height: 75px;

            margin: auto;

            border-radius: 50%;

            background: #0b6b43;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

        }

        h2 {

            margin-top: 12px;

        }

        .info {

            margin-top: 20px;

        }

        .info div {

            padding: 13px 0;

            border-bottom: 1px solid #e5e7eb;

        }

        .label {

            font-weight: bold;

        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #c62828;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        #message {

            text-align: center;

            margin-top: 15px;

            font-weight: bold;

        }

    </style>

</head>

<body>

<header>

    <h1>🛒 Market Bouaké</h1>

</header>

<div class="container">

    <div class="card">

        <div class="profile">

            <div class="avatar">

                👤

            </div>

            <h2 id="name">

                Chargement...

            </h2>

        </div>

        <div class="info">

            <div>

                <span class="label">Email :</span>

                <span id="email"></span>

            </div>

            <div>

                <span class="label">Téléphone :</span>

                <span id="phone"></span>

            </div>

            <div>

                <span class="label">Rôle :</span>

                <span id="role"></span>

            </div>

            <div>

                <span class="label">Statut vendeur :</span>

                <span id="sellerStatus"></span>

            </div>

        </div>

        <button id="logoutButton">

            Se déconnecter

        </button>

        <p id="message"></p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =

    "https://qgdxxrnsiyzbacxxfdrg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =

    "sb_publishable_QE2in_ocTQQDEt0HW9wSCg_PKSzqo7N";

const supabaseClient =

    window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_PUBLISHABLE_KEY

    );

async function loadAccount() {

    const {

        data,

        error

    } = await supabaseClient.auth.getUser();

    if (error || !data.user) {

        window.location.href =

            "connexion.html";

        return;

    }

    const user = data.user;

    const {

        data: profile,

        error: profileError

    } = await supabaseClient

        .from("profiles")

        .select("*")

        .eq("id", user.id)

        .single();

    if (profileError) {

        console.error(

            "Erreur profil :",

            profileError

        );

        document.getElementById("name").textContent =

            "Compte Market Bouaké";

        document.getElementById("email").textContent =

            user.email || "";

        return;

    }

    document.getElementById("name").textContent =

        (profile.first_name || "") +

        " " +

        (profile.last_name || "");

    document.getElementById("email").textContent =

        profile.email || user.email || "";

    document.getElementById("phone").textContent =

        profile.phone || "Non renseigné";

    document.getElementById("role").textContent =

        profile.role || "buyer";

    document.getElementById("sellerStatus").textContent =

        profile.seller_status || "not_seller";

}

document

    .getElementById("logoutButton")

    .addEventListener(

        "click",

        async function() {

            const {

                error

            } = await supabaseClient.auth.signOut();

            if (error) {

                document.getElementById("message").textContent =

                    "Erreur lors de la déconnexion.";

                return;

            }

            window.location.href =

                "connexion.html";

        }

    );

loadAccount();

</script>

</body>

</html>
