<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta

        name="viewport"

        content="width=device-width, initial-scale=1.0, viewport-fit=cover"

    >

    <meta

        name="theme-color"

        content="#2563EB"

    >

    <meta

        name="description"

        content="Voir un produit sur Market Bouaké, marketplace locale."

    >

    <title>Produit | Market Bouaké</title>

    <style>

        /* =========================================================

           MARKET BOUAKÉ

           PRODUIT.HTML — VERSION DÉFINITIVE — JOUR 4

           Identité visuelle :

           - Bleu royal : #2563EB

           - Bleu nuit : #0F172A

           - Gris bleuté : #64748B

           - Rouge badge : #EF4444

           - Fond : #FFFFFF / #F8FAFC

           Cette page reprend directement l'identité visuelle

           de l'accueil.

           ========================================================= */

        :root {

            --mb-blue: #2563EB;

            --mb-blue-dark: #1D4ED8;

            --mb-navy: #0F172A;

            --mb-slate: #475569;

            --mb-muted: #64748B;

            --mb-border: #E2E8F0;

            --mb-light: #F8FAFC;

            --mb-white: #FFFFFF;

            --mb-red: #EF4444;

            --mb-green: #16A34A;

            --mb-shadow:

                0 8px 30px rgba(15, 23, 42, .07);

            --mb-radius: 18px;

        }

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }

        html {

            scroll-behavior: smooth;

        }

        body {

            min-height: 100vh;

            background: #FFFFFF;

            color: var(--mb-navy);

            font-family:

                Inter,

                ui-sans-serif,

                system-ui,

                -apple-system,

                BlinkMacSystemFont,

                "Segoe UI",

                sans-serif;

            -webkit-font-smoothing: antialiased;

            padding-bottom: 88px;

        }

        button,

        input,

        textarea,

        select {

            font: inherit;

        }

        button,

        a {

            -webkit-tap-highlight-color: transparent;

        }

        a {

            color: inherit;

        }

        button {

            cursor: pointer;

        }

        img {

            max-width: 100%;

        }

        /* =========================================================

           HEADER

           ========================================================= */

        .mb-header {

            position: sticky;

            top: 0;

            z-index: 1000;

            width: 100%;

            background: rgba(255,255,255,.97);

            border-bottom: 1px solid rgba(226,232,240,.75);

            backdrop-filter: blur(12px);

        }

        .mb-header-inner {

            width: min(1280px, 100%);

            min-height: 74px;

            margin: 0 auto;

            padding: 10px 18px;

            display: flex;

            align-items: center;

            gap: 13px;

        }

        /* LOGO */

        .mb-brand {

            display: inline-flex;

            align-items: center;

            gap: 10px;

            text-decoration: none;

            min-width: 0;

            flex-shrink: 0;

        }

        .mb-logo {

            width: 46px;

            height: 46px;

            flex: 0 0 46px;

            display: grid;

            place-items: center;

            border-radius: 14px;

            background: var(--mb-blue);

            color: #FFFFFF;

            box-shadow:

                0 5px 14px rgba(37,99,235,.20);

        }

        .mb-logo svg {

            width: 29px;

            height: 29px;

        }

        .mb-brand-text {

            min-width: 0;

        }

        .mb-brand-name {

            display: block;

            color: var(--mb-blue);

            font-size: 17px;

            line-height: 1.05;

            font-weight: 850;

            white-space: nowrap;

        }

        .mb-brand-subtitle {

            display: block;

            margin-top: 3px;

            color: var(--mb-muted);

            font-size: 10px;

            line-height: 1;

            font-weight: 600;

            white-space: nowrap;

        }

        /* HEADER ACTIONS */

        .mb-header-actions {

            margin-left: auto;

            display: flex;

            align-items: center;

            gap: 7px;

        }

        .mb-header-action {

            position: relative;

            width: 42px;

            height: 42px;

            display: grid;

            place-items: center;

            border: 0;

            border-radius: 13px;

            background: transparent;

            color: var(--mb-navy);

            text-decoration: none;

        }

        .mb-header-action:hover {

            background: var(--mb-light);

        }

        .mb-header-action svg {

            width: 23px;

            height: 23px;

        }

        .mb-cart-badge {

            position: absolute;

            top: 1px;

            right: 0;

            min-width: 18px;

            height: 18px;

            padding: 0 4px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 999px;

            background: var(--mb-red);

            color: #FFFFFF;

            font-size: 9px;

            line-height: 1;

            font-weight: 800;

            border: 2px solid #FFFFFF;

        }

        .mb-menu-button {

            width: 43px;

            height: 43px;

            display: grid;

            place-items: center;

            border: 0;

            border-radius: 14px;

            background: #F8FAFC;

            color: var(--mb-navy);

            box-shadow:

                0 4px 12px rgba(15,23,42,.05);

        }

        .mb-menu-button svg {

            width: 23px;

            height: 23px;

        }

        /* =========================================================

           MENU MOBILE / DRAWER

           ========================================================= */

        .mb-menu-overlay {

            position: fixed;

            inset: 0;

            z-index: 2000;

            background: rgba(15,23,42,.38);

            opacity: 0;

            visibility: hidden;

            transition:

                opacity .2s ease,

                visibility .2s ease;

        }

        .mb-menu-overlay.is-open {

            opacity: 1;

            visibility: visible;

        }

        .mb-menu-panel {

            position: absolute;

            top: 0;

            right: 0;

            width: min(340px, 88vw);

            height: 100%;

            padding: 22px;

            overflow-y: auto;

            background: #FFFFFF;

            box-shadow:

                -12px 0 35px rgba(15,23,42,.12);

            transform: translateX(100%);

            transition: transform .25s ease;

        }

        .mb-menu-overlay.is-open .mb-menu-panel {

            transform: translateX(0);

        }

        .mb-menu-head {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 24px;

        }

        .mb-menu-title {

            color: var(--mb-navy);

            font-size: 20px;

            font-weight: 800;

        }

        .mb-menu-close {

            width: 40px;

            height: 40px;

            display: grid;

            place-items: center;

            border: 0;

            border-radius: 12px;

            background: var(--mb-light);

            color: var(--mb-navy);

        }

        .mb-menu-link {

            width: 100%;

            min-height: 50px;

            margin-bottom: 8px;

            display: flex;

            align-items: center;

            gap: 13px;

            padding: 10px 13px;

            border-radius: 13px;

            color: var(--mb-navy);

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

        }

        .mb-menu-link:hover {

            background: var(--mb-light);

        }

        .mb-menu-link svg {

            width: 21px;

            height: 21px;

            color: var(--mb-blue);

        }

        /* =========================================================

           CONTENU

           ========================================================= */

        .mb-main {

            width: min(1180px, 100%);

            margin: 0 auto;

            padding: 18px;

        }

        .mb-back-row {

            display: flex;

            align-items: center;

            margin-bottom: 16px;

        }

        .mb-back-button {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            border: 0;

            background: transparent;

            color: var(--mb-slate);

            font-size: 13px;

            font-weight: 750;

            padding: 7px 0;

        }

        .mb-back-button:hover {

            color: var(--mb-blue);

        }

        .mb-back-button svg {

            width: 18px;

            height: 18px;

        }

        /* =========================================================

           ETAT PRODUIT

           ========================================================= */

        .mb-product-page {

            width: 100%;

        }

        .mb-product-error {

            min-height: 360px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 10px;

            padding: 30px;

            text-align: center;

            border: 1px solid var(--mb-border);

            border-radius: 20px;

            background: var(--mb-light);

        }

        .mb-product-error-icon {

            width: 64px;

            height: 64px;

            display: grid;

            place-items: center;

            border-radius: 50%;

            background: #FFFFFF;

            color: var(--mb-blue);

        }

        .mb-product-error strong {

            font-size: 18px;

        }

        .mb-product-error span {

            max-width: 450px;

            color: var(--mb-muted);

            font-size: 13px;

            line-height: 1.5;

        }

        .mb-product-error a {

            margin-top: 8px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 42px;

            padding: 0 17px;

            border-radius: 11px;

            background: var(--mb-blue);

            color: #FFFFFF;

            text-decoration: none;

            font-size: 13px;

            font-weight: 750;

        }

        /* =========================================================

           PRODUIT

           ========================================================= */

        .mb-product-layout {

            display: grid;

            gap: 24px;

        }

        /* GALERIE */

        .mb-gallery {

            min-width: 0;

        }

        .mb-main-image-box {

            position: relative;

            width: 100%;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            border-radius: 20px;

            background: var(--mb-light);

            border: 1px solid var(--mb-border);

        }

        .mb-main-image {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

        }

        .mb-gallery-counter {

            position: absolute;

            right: 12px;

            bottom: 12px;

            min-height: 30px;

            padding: 0 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 999px;

            background: rgba(15,23,42,.72);

            color: #FFFFFF;

            font-size: 11px;

            font-weight: 750;

        }

        .mb-gallery-thumbs {

            display: flex;

            gap: 8px;

            margin-top: 9px;

            overflow-x: auto;

            scrollbar-width: none;

        }

        .mb-gallery-thumbs::-webkit-scrollbar {

            display: none;

        }

        .mb-thumb {

            flex: 0 0 66px;

            width: 66px;

            height: 66px;

            overflow: hidden;

            padding: 0;

            border: 2px solid transparent;

            border-radius: 11px;

            background: var(--mb-light);

        }

        .mb-thumb.is-active {

            border-color: var(--mb-blue);

        }

        .mb-thumb img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }

        /* INFORMATIONS */

        .mb-product-info {

            min-width: 0;

        }

        .mb-product-category {

            display: inline-flex;

            align-items: center;

            min-height: 28px;

            padding: 0 9px;

            border-radius: 999px;

            background: #EFF6FF;

            color: var(--mb-blue);

            font-size: 10px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: .02em;

        }

        .mb-product-title {

            margin-top: 10px;

            color: var(--mb-navy);

            font-size: clamp(24px, 5vw, 36px);

            line-height: 1.15;

            font-weight: 850;

            letter-spacing: -.02em;

        }

        .mb-product-price-row {

            margin-top: 13px;

            display: flex;

            align-items: baseline;

            flex-wrap: wrap;

            gap: 9px;

        }

        .mb-product-price {

            color: var(--mb-blue);

            font-size: 24px;

            font-weight: 850;

        }

        .mb-product-old-price {

            color: var(--mb-muted);

            font-size: 14px;

            text-decoration: line-through;

        }

        .mb-product-description {

            margin-top: 16px;

            color: var(--mb-slate);

            font-size: 14px;

            line-height: 1.7;

            white-space: pre-line;

        }

        /* VENDEUR */

        .mb-seller-card {

            margin-top: 20px;

            padding: 14px;

            display: flex;

            align-items: center;

            gap: 11px;

            border: 1px solid var(--mb-border);

            border-radius: 15px;

            background: #FFFFFF;

        }

        .mb-seller-avatar {

            width: 44px;

            height: 44px;

            flex: 0 0 44px;

            overflow: hidden;

            display: grid;

            place-items: center;

            border-radius: 50%;

            background: #EFF6FF;

            color: var(--mb-blue);

            font-size: 16px;

            font-weight: 800;

        }

        .mb-seller-avatar img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }

        .mb-seller-info {

            min-width: 0;

            flex: 1;

        }

        .mb-seller-label {

            color: var(--mb-muted);

            font-size: 10px;

            font-weight: 650;

        }

        .mb-seller-name {

            margin-top: 2px;

            overflow: hidden;

            color: var(--mb-navy);

            font-size: 14px;

            font-weight: 800;

            white-space: nowrap;

            text-overflow: ellipsis;

        }

        /* STOCK */

        .mb-stock {

            margin-top: 14px;

            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 12px;

            font-weight: 750;

        }

        .mb-stock-dot {

            width: 8px;

            height: 8px;

            border-radius: 50%;

            background: var(--mb-green);

        }

        .mb-stock.is-out {

            color: #B91C1C;

        }

        .mb-stock.is-out .mb-stock-dot {

            background: var(--mb-red);

        }

        /* TAILLES */

        .mb-option-block {

            margin-top: 19px;

        }

        .mb-option-label {

            display: block;

            margin-bottom: 9px;

            color: var(--mb-navy);

            font-size: 13px;

            font-weight: 800;

        }

        .mb-size-list {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

        }

        .mb-size-button {

            min-width: 44px;

            min-height: 39px;

            padding: 0 11px;

            border: 1px solid var(--mb-border);

            border-radius: 10px;

            background: #FFFFFF;

            color: var(--mb-slate);

            font-size: 12px;

            font-weight: 750;

        }

        .mb-size-button:hover,

        .mb-size-button.is-selected {

            border-color: var(--mb-blue);

            background: #EFF6FF;

            color: var(--mb-blue);

        }

        /* QUANTITE */

        .mb-quantity-row {

            margin-top: 19px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

        }

        .mb-quantity {

            height: 42px;

            display: flex;

            align-items: center;

            border: 1px solid var(--mb-border);

            border-radius: 11px;

            overflow: hidden;

        }

        .mb-quantity button {

            width: 40px;

            height: 42px;

            display: grid;

            place-items: center;

            border: 0;

            background: #FFFFFF;

            color: var(--mb-navy);

            font-size: 18px;

            font-weight: 750;

        }

        .mb-quantity button:hover {

            background: var(--mb-light);

        }

        .mb-quantity-value {

            min-width: 38px;

            text-align: center;

            color: var(--mb-navy);

            font-size: 13px;

            font-weight: 800;

        }

        /* ACTIONS */

        .mb-actions {

            margin-top: 20px;

            display: grid;

            gap: 9px;

        }

        .mb-primary-button,

        .mb-secondary-button {

            min-height: 48px;

            width: 100%;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            border-radius: 12px;

            font-size: 13px;

            font-weight: 800;

            text-decoration: none;

        }

        .mb-primary-button {

            border: 1px solid var(--mb-blue);

            background: var(--mb-blue);

            color: #FFFFFF;

        }

        .mb-primary-button:hover {

            background: var(--mb-blue-dark);

        }

        .mb-secondary-button {

            border: 1px solid var(--mb-border);

            background: #FFFFFF;

            color: var(--mb-navy);

        }

        .mb-secondary-button:hover {

            border-color: var(--mb-blue);

            color: var(--mb-blue);

        }

        .mb-primary-button:disabled {

            border-color: var(--mb-border);

            background: #F1F5F9;

            color: #94A3B8;

            cursor: not-allowed;

        }

        /* WHATSAPP / CONTACT */

        .mb-contact-button {

            margin-top: 9px;

            width: 100%;

            min-height: 46px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            border: 1px solid #BBF7D0;

            border-radius: 12px;

            background: #F0FDF4;

            color: #15803D;

            font-size: 13px;

            font-weight: 800;

        }

        .mb-contact-button:hover {

            background: #DCFCE7;

        }

        /* =========================================================

           DETAILS

           ========================================================= */

        .mb-details-section {

            margin-top: 25px;

            padding-top: 22px;

            border-top: 1px solid var(--mb-border);

        }

        .mb-section-title {

            color: var(--mb-navy);

            font-size: 18px;

            font-weight: 850;

        }

        .mb-details-grid {

            margin-top: 14px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 8px;

        }

        .mb-detail-item {

            padding: 12px;

            border-radius: 12px;

            background: var(--mb-light);

        }

        .mb-detail-label {

            color: var(--mb-muted);

            font-size: 10px;

            font-weight: 650;

        }

        .mb-detail-value {

            margin-top: 4px;

            color: var(--mb-navy);

            font-size: 12px;

            font-weight: 750;

            word-break: break-word;

        }

        /* =========================================================

           AVIS

           ========================================================= */

        .mb-reviews {

            margin-top: 28px;

            padding-top: 24px;

            border-top: 1px solid var(--mb-border);

        }

        .mb-reviews-summary {

            margin-top: 12px;

            padding: 15px;

            border-radius: 14px;

            background: var(--mb-light);

            display: flex;

            align-items: center;

            gap: 12px;

        }

        .mb-rating-number {

            color: var(--mb-navy);

            font-size: 24px;

            font-weight: 850;

        }

        .mb-rating-stars {

            color: #F59E0B;

            letter-spacing: 1px;

            font-size: 16px;

        }

        .mb-rating-count {

            color: var(--mb-muted);

            font-size: 11px;

        }

        .mb-review-list {

            margin-top: 12px;

            display: grid;

            gap: 9px;

        }

        .mb-review-item {

            padding: 13px;

            border: 1px solid var(--mb-border);

            border-radius: 13px;

        }

        .mb-review-top {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

        }

        .mb-review-author {

            color: var(--mb-navy);

            font-size: 12px;

            font-weight: 800;

        }

        .mb-review-stars {

            color: #F59E0B;

            font-size: 12px;

        }

        .mb-review-text {

            margin-top: 7px;

            color: var(--mb-slate);

            font-size: 12px;

            line-height: 1.55;

        }

        /* =========================================================

           NAVIGATION MOBILE

           ========================================================= */

        .mb-mobile-nav {

            position: fixed;

            z-index: 1500;

            right: 0;

            bottom: 0;

            left: 0;

            width: 100%;

            min-height: 72px;

            padding:

                7px

                4px

                calc(7px + env(safe-area-inset-bottom));

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            background: rgba(255,255,255,.98);

            border-top: 1px solid rgba(226,232,240,.85);

            box-shadow:

                0 -7px 24px rgba(15,23,42,.07);

            backdrop-filter: blur(14px);

        }

        .mb-mobile-nav-item {

            position: relative;

            min-width: 0;

            min-height: 60px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 4px;

            border: 0;

            background: transparent;

            color: var(--mb-muted);

            text-decoration: none;

        }

        .mb-mobile-nav-icon {

            position: relative;

            width: 24px;

            height: 24px;

            display: grid;

            place-items: center;

        }

        .mb-mobile-nav-icon svg {

            width: 23px;

            height: 23px;

            stroke: currentColor;

        }

        .mb-mobile-nav-label {

            max-width: 100%;

            overflow: hidden;

            color: currentColor;

            font-size: 10px;

            line-height: 1;

            font-weight: 750;

            white-space: nowrap;

            text-overflow: ellipsis;

        }

        .mb-mobile-nav-item.is-active {

            color: var(--mb-blue);

        }

        .mb-mobile-nav-cart-badge {

            position: absolute;

            top: -4px;

            right: -8px;

            min-width: 17px;

            height: 17px;

            padding: 0 4px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 999px;

            background: var(--mb-red);

            color: #FFFFFF;

            border: 2px solid #FFFFFF;

            font-size: 8px;

            line-height: 1;

            font-weight: 850;

        }

        /* =========================================================

           PETITS ÉCRANS

           ========================================================= */

        @media (max-width: 360px) {

            .mb-header-inner {

                padding-left: 11px;

                padding-right: 11px;

                gap: 7px;

            }

            .mb-brand-name {

                font-size: 15px;

            }

            .mb-brand-subtitle {

                font-size: 9px;

            }

            .mb-logo {

                width: 42px;

                height: 42px;

                flex-basis: 42px;

            }

            .mb-header-action {

                width: 37px;

                height: 37px;

            }

            .mb-menu-button {

                width: 39px;

                height: 39px;

            }

            .mb-main {

                padding: 14px 12px;

            }

            .mb-mobile-nav {

                min-height: 68px;

            }

            .mb-mobile-nav-label {

                font-size: 9px;

            }

        }

        /* =========================================================

           TABLETTE / DESKTOP

           ========================================================= */

        @media (min-width: 700px) {

            body {

                padding-bottom: 30px;

            }

            .mb-mobile-nav {

                display: none;

            }

            .mb-product-layout {

                grid-template-columns:

                    minmax(0, 1.02fr)

                    minmax(380px, .98fr);

                align-items: start;

                gap: 38px;

    <script>

        /* =========================================================

           ========================================================= */

        (() => {

            "use strict";

            /* =====================================================

               CONFIGURATION SUPABASE

               ===================================================== */

            const SUPABASE_URL =

                "https://qgdxxrnsiyzbacxxfdrg.supabase.co";

            const SUPABASE_KEY =

                "sb_publishable_QE2in_ocTQQDEt0HW9wSCg_PKSzqo7N";

            const API_URL =

                `${SUPABASE_URL}/rest/v1`;

            const HEADERS = {

                "apikey": SUPABASE_KEY,

                "Content-Type": "application/json"

            };

            /* =====================================================

               CONFIGURATION

               ===================================================== */

            const FALLBACK_IMAGE =

                "data:image/svg+xml;charset=UTF-8," +

                encodeURIComponent(`

                    <svg

                        xmlns="http://www.w3.org/2000/svg"

                        width="800"

                        height="800"

                        viewBox="0 0 800 800"

                    >

                        <rect

                            width="800"

                            height="800"

                        />

                            height="220"

                            rx="25"

                            fill="none"

                            stroke="#CBD5E1"

                            stroke-width="18"

                        />

                        <path

                            d="M350 255v-40c0-35 22-60 50-60s50 25 50 60v40"

                            fill="none"

                            stroke="#CBD5E1"

                            stroke-width="18"

                            stroke-linecap="round"

                        />

                        <text

                            x="400"

                            y="560"

                            text-anchor="middle"

                            font-family="Arial"

                            font-size="34"

                            font-weight="700"

                            fill="#64748B"

                        >

                            Market Bouaké

                        </text>

                    </svg>

                `);

            /* =====================================================

               ÉTAT

               ===================================================== */

            const state = {

                product: null,

                reviews: [],

                seller: null,

                shop: null,

                category: null,

                images: [],

                selectedImage: 0,

                selectedSize: "",

                quantity: 1,

                cartCount: 0

            };

            /* =====================================================

               OUTILS

               ===================================================== */

            function escapeHTML(value) {

                if (

                    value === null ||

                    value === undefined

                ) {

                    return "";

                }

                return String(value)

                    .replace(/&/g, "&amp;")

                    .replace(/</g, "&lt;")

                    .replace(/>/g, "&gt;")

                    .replace(/"/g, "&quot;")

                    .replace(/'/g, "&#039;");

            }

            function normalizeText(value) {

                return String(value || "")

                    .normalize("NFD")

                    .replace(

                        /[\u0300-\u036f]/g,

                        ""

                    )

                    .toLowerCase()

                    .trim();

            }

            function formatPrice(value) {

                const number = Number(value);

                if (

                    !Number.isFinite(number)

                ) {

                    return "Prix non renseigné";

                }

                return new Intl.NumberFormat(

                    "fr-FR",

                    {

                        maximumFractionDigits: 0

                    }

                ).format(number) + " FCFA";

            }

            function getProductId() {

                const params =

                    new URLSearchParams(

                        window.location.search

                    );

                return params.get("id");

            }

            function isValidUUID(value) {

                return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i

                    .test(

                        String(value || "")

                    );

            }

            function getImage(product, index) {

                if (!product) {

                    return FALLBACK_IMAGE;

                }

                const images = [

                    product.image_url_1,

                    product.image_url_2,

                    product.image_url_3

                ];

                const image = images[index];

                return (

                    typeof image === "string" &&

                    image.trim()

                )

                    ? image.trim()

                    : FALLBACK_IMAGE;

            }

            function getImages(product) {

                if (!product) {

                    return [FALLBACK_IMAGE];

                }

                const images = [

                    product.image_url_1,

                    product.image_url_2,

                    product.image_url_3

                ].filter(

                    image =>

                        typeof image === "string" &&

                        image.trim()

                );

                return images.length

                    ? images

                    : [FALLBACK_IMAGE];

            }

            function isProperty(product) {

                if (!product) {

                    return false;

                }

                return Boolean(

                    product.property_type ||

                    product.monthly_price !== null ||

                    product.deposit_amount !== null ||

                    product.rooms_count !== null ||

                    product.bedrooms_count !== null ||

                    product.check_in_time !== null ||

                    product.check_out_time !== null ||

                    product.capacity !== null

                );

            }

            function getProductPrice(product) {

                if (isProperty(product)) {

                    return (

                        product.monthly_price ??

                        product.price

                    );

                }

                return product.price;

            }

            function getProductName(seller) {

                if (!seller) {

                    return "";

                }

                if (seller.full_name) {

                    return seller.full_name;

                }

                return [

                    seller.first_name,

                    seller.last_name

                ]

                    .filter(Boolean)

                    .join(" ");

            }

            function getCartItems() {

                const possibleKeys = [

                    "marketbouake_cart",

                    "market_bouake_cart",

                    "cart"

                ];

                for (

                    const key of possibleKeys

                ) {

                    try {

                        const raw =

                            localStorage.getItem(

                                key

                            );

                        if (!raw) {

                            continue;

                        }

                        const parsed =

                            JSON.parse(raw);

                        if (

                            Array.isArray(parsed)

                        ) {

                            return parsed;

                        }

                        if (

                            parsed &&

                            Array.isArray(

                                parsed.items

                            )

                        ) {

                            return parsed.items;

                        }

                    } catch (error) {

                        console.warn(

                            "Panier localStorage invalide :",

                            error

                        );

                    }

                }

                return [];

            }

            function saveCartItems(items) {

                localStorage.setItem(

                    "marketbouake_cart",

                    JSON.stringify(items)

                );

            }

            function calculateCartCount() {

                const items =

                    getCartItems();

                return items.reduce(

                    (total, item) => {

                        const quantity =

                            Number(

                                item.quantity ??

                                item.qty ??

                                1

                            );

                        return total +

                            (

                                Number.isFinite(

                                    quantity

                                )

                                    ? quantity

                                    : 1

                            );

                    },

                    0

                );

            }

            /* =====================================================

               SUPABASE

               ===================================================== */

            async function supabaseGet(

                table,

                params = {}

            ) {

                const searchParams =

                    new URLSearchParams();

                Object.entries(

                    params

                ).forEach(

                    ([key, value]) => {

                        if (

                            value !==

                                undefined &&

                            value !== null &&

                            value !== ""

                        ) {

                            searchParams.set(

                                key,

                                value

                            );

                        }

                    }

                );

                const response =

                    await fetch(

                        `${API_URL}/${table}?${searchParams}`,

                        {

                            method: "GET",

                            headers: HEADERS

                        }

                    );

                if (!response.ok) {

                    const text =

                        await response.text();

                    throw new Error(

                        `Supabase ${response.status}: ${text}`

                    );

                }

                return response.json();

            }

            /* =====================================================

               PRODUIT

               ===================================================== */

            async function fetchProduct(id) {

                const rows =

                    await supabaseGet(

                        "products",

                        {

                            select: "*",

                            id: `eq.${id}`,

                            is_active: "eq.true",

                            limit: "1"

                        }

                    );

                return rows[0] || null;

            }

            async function fetchSeller(

                sellerId

            ) {

                if (!isValidUUID(sellerId)) {

                    return null;

                }

                try {

                    const rows =

                        await supabaseGet(

                            "profiles",

                            {

                                select:

                                    "id,first_name,last_name,full_name,avatar_url,photo_url,seller_status",

                                id:

                                    `eq.${sellerId}`,

                                limit: "1"

                            }

                        );

                    return rows[0] || null;

                } catch (error) {

                    console.warn(

                        "Profil vendeur indisponible :",

                        error

                    );

                    return null;

                }

            }

            async function fetchShop(

                shopId

            ) {

                if (!shopId) {

                    return null;

                }

                try {

                    const rows =

                        await supabaseGet(

                            "shops",

                            {

                                select: "*",

                                id:

                                    `eq.${shopId}`,

                                limit: "1"

                            }

                        );

                    return rows[0] || null;

                } catch (error) {

                    console.warn(

                        "Boutique indisponible :",

                        error

                    );

                    return null;

                }

            }

            async function fetchCategory(

                categoryId

            ) {

                if (!categoryId) {

                    return null;

                }

                try {

                    const rows =

                        await supabaseGet(

                            "categories",

                            {

                                select:

                                    "id,name",

                                id:

                                    `eq.${categoryId}`,

                                limit: "1"

                            }

                        );

                    return rows[0] || null;

                } catch (error) {

                    return null;

                }

            }

            async function fetchReviews(

                productId

            ) {

                if (!isValidUUID(productId)) {

                    return [];

                }

                try {

                    return await supabaseGet(

                        "reviews",

                        {

                            select: "*",

                            product_id:

                        product.sizes

                            .filter(Boolean);

                    typeof product.sizes ===

                    "string"

                ) {

                    try {

                        const parsed =

                            JSON.parse(

                                product.sizes

                            );

                        if (

                            Array.isArray(

                                parsed

                            )

                        ) {

                            sizes = parsed;

                        }

                    } catch {

                        sizes =

                            product.sizes

                                .split(",")

                                .map(

                                )

                                .filter(Boolean);

                const stars =

            function setupGallery() {

                    .querySelectorAll(

                        "[data-gallery-index]"

                    )

                    .forEach(

                        button => {

                            button.addEventListener(

                                "click",

                                () => {

                                    const index =

                                        Number(

                                            button.dataset

                                                .galleryIndex

                                        );

                                    if (

                                        !Number.isFinite(

                                            index

                                        )

                                    ) {

                                        return;

                                    }

                                    state.selectedImage =

                                        index;

                                    const image =

                                        document.getElementById(

                                            "mainProductImage"

                                        );

                                    const counter =

                                        document.getElementById(

                                            "galleryCounter"

                                        );

                                    if (image) {

                                        image.src =

                                            state.images[

                                                index

                                            ];

                                    }

                                    if (counter) {

                                        counter.textContent =

                                            `${index + 1} / ${state.images.length}`;

                                    }

                                    document

                                        .querySelectorAll(

                                            "[data-gallery-index]"

                                        )

                                        .forEach(

                                            item => {

                                                item.classList.toggle(

                                                    "is-active",

                                                    item ===

                                                        button

                                                );

                                            }

                                        );

                                }

                            );

                        }

                    );

            /* =====================================================

               TAILLES

               ===================================================== */

            function setupSizes() {

                document

                    .querySelectorAll(

                        "[data-size]"

                    )

                    .forEach(

                        button => {

                            button.addEventListener(

                                "click",

                                () => {

                                    document

                                        .querySelectorAll(

                                            "[data-size]"

                                        )

                                        .forEach(

                                            item =>

                                                item.classList

                                                    .remove(

                                                        "is-selected"

                                                    )

                                        );

                                    button.classList.add(

                                        "is-selected"

                                    );

                                    state.selectedSize =

                                        button.dataset

                                            .size || "";

                                }

                            );

                        }

                    );

            }

            /* =====================================================

               QUANTITÉ

               ===================================================== */

            function setupQuantity() {

                const minus =

                    document.getElementById(

                        "quantityMinus"

                    );

                const plus =

                    document.getElementById(

                        "quantityPlus"

                    );

                const value =

                    document.getElementById(

                        "quantityValue"

                    );

                if (

                    !minus ||

                    !plus ||

                    !value

                ) {

                    return;

                }

                minus.addEventListener(

                    "click",

                    () => {

                        state.quantity =

                            Math.max(

                                1,

                                state.quantity - 1

                            );

                        value.textContent =

                            state.quantity;

                    }

                );

                plus.addEventListener(

                    "click",

                    () => {

                        const stock =

                            Number(

                                state.product.stock

                            );

                        if (

                            Number.isFinite(

                                stock

                            ) &&

                            stock > 0

                        ) {

                            state.quantity =

                                Math.min(

                                    stock,

                                    state.quantity + 1

                                );

                        } else {

                            state.quantity += 1;

                        }

                        value.textContent =

                            state.quantity;

                    }

                );

            }

            /* =====================================================

               AJOUT PANIER

               ===================================================== */

            function addToCart() {

                const product =

                    state.product;

                if (!product) {

                    return;

                }

                const items =

                    getCartItems();

                const productId =

                    product.id;

                const existingIndex =

                    items.findIndex(

                        item =>

                            String(

                                item.product_id ||

                                item.id

                            ) ===

                            String(

                                productId

                            ) &&

                            String(

                                item.size || ""

                            ) ===

                            String(

                                state.selectedSize ||

                                ""

                            )

                    );

                if (

                    existingIndex >= 0

                ) {

                    const existing =

                        items[

                            existingIndex

                        ];

                    existing.quantity =

                        Number(

                            existing.quantity ||

                            0

                        ) +

                        state.quantity;

                } else {

                    items.push({

                        product_id:

                            product.id,

                        id:

                            product.id,

                        name:

                            product.name,

                        price:

                            getProductPrice(

                                product

                            ),

                        image_url:

                            getImage(

                                product,

                                0

                            ),

                        quantity:

                            state.quantity,

                        size:

                            state.selectedSize ||

                            "",

                        seller_id:

                            product.seller_id ||

                            null,

                        shop_id:

                            product.shop_id ||

                            null

                    });

                }

                saveCartItems(items);

                updateCartBadges();

                showTemporaryButtonMessage(

                    "addToCartButton",

                    "Ajouté au panier"

                );

            }

            /* =====================================================

               ===================================================== */

            function orderNow() {

                addToCart();

                window.location.href =

                    "panier.html";

            }

            /* =====================================================

               FAVORIS

               ===================================================== */

            function addFavorite() {

                const product =

                    state.product;

                if (!product) {

                    return;

                }

                let favorites = [];

                try {

                    favorites =

                        JSON.parse(

                            localStorage.getItem(

                                "marketbouake_favorites"

                            ) || "[]"

                        );

                } catch {

                    favorites = [];

                }

                if (

                    !Array.isArray(

                        favorites

                    )

                ) {

                    favorites = [];

                }

                const exists =

                    favorites.some(

                        item =>

                            String(

                                item.product_id ||

                                item.id ||

                                item

                            ) ===

                            String(

                                product.id

                            )

                    );

                if (!exists) {

                    favorites.push({

                        product_id:

                            product.id,

                        name:

                            product.name,

                        image_url:

                            getImage(

                                product,

                                0

                            ),

                        price:

                            getProductPrice(

                                product

                            )

                    });

                    localStorage.setItem(

                        "marketbouake_favorites",

                        JSON.stringify(

                            favorites

                        )

                    );

                    showTemporaryButtonMessage(

                        "favoriteButton",

                        "Ajouté aux favoris"

                    );

                } else {

                    showTemporaryButtonMessage(

                        "favoriteButton",

                        "Déjà dans les favoris"

                    );

                }

            }

            /* =====================================================

               CONTACT VENDEUR

               ===================================================== */

            function contactSeller() {

                const product =

                    state.product;

                if (!product) {

                    return;

                }

                const phone =

                    product.whatsapp ||

                    product.whatsapp_phone ||

                    state.seller?.whatsapp ||

                    state.seller?.phone ||

                    state.seller?.phone_number ||

                    "";

                const cleanPhone =

                    String(phone)

                        .replace(

                            /[^0-9+]/g,

                            ""

                        );

                const message =

                    `Bonjour, je suis intéressé(e) par le produit "${product.name}" sur Market Bouaké.`;

                if (cleanPhone) {

                    const normalized =

                        cleanPhone

                            .replace(

                                /^\+/,

                                ""

                            );

                    window.open(

                        `https://wa.me/${normalized}?text=${encodeURIComponent(message)}`,

                        "_blank",

                        "noopener,noreferrer"

                    );

                    return;

                }

                window.location.href =

                    "messages.html";

            }

            /* =====================================================

               MESSAGE TEMPORAIRE BOUTON

               ===================================================== */

            function showTemporaryButtonMessage(

                buttonId,

                message

            ) {

                const button =

                    document.getElementById(

                        buttonId

                    );

                if (!button) {

                    return;

                }

                const original =

                    button.innerHTML;

                button.innerHTML =

                    `<span>${escapeHTML(

                        message

                    )}</span>`;

                button.disabled = true;

                setTimeout(

                    () => {

                        button.innerHTML =

                            original;

                        button.disabled =

                            false;

                    },

                    1100

                );

            }

            /* =====================================================

               INTERACTIONS PRODUIT

               ===================================================== */

            function setupProductInteractions() {

                setupGallery();

                setupSizes();

                setupQuantity();

                const addButton =

                    document.getElementById(

                        "addToCartButton"

                    );

                if (addButton) {

                    addButton.addEventListener(

                        "click",

                        addToCart

                    );

                }

                const orderButton =

                    document.getElementById(

                        "orderNowButton"

                    );

                if (orderButton) {

                    orderButton.addEventListener(

                        "click",

                        orderNow

                    );

                }

                const favoriteButton =

                    document.getElementById(

                        "favoriteButton"

                    );

                if (favoriteButton) {

                    favoriteButton.addEventListener(

                        "click",

                        addFavorite

                    );

                }

                const contactButton =

                    document.getElementById(

                        "contactSellerButton"

                    );

                if (contactButton) {

                    contactButton.addEventListener(

                        "click",

                        contactSeller

                    );

                }

            }

            /* =====================================================

               BADGES PANIER

               ===================================================== */

            function updateCartBadges() {

                state.cartCount =

                    calculateCartCount();

                const headerBadge =

                    document.getElementById(

                        "headerCartBadge"

                    );

                const mobileBadge =

                    document.getElementById(

                        "mobileCartBadge"

                    );

                const display =

                    state.cartCount > 99

                        ? "99+"

                        : String(

                            state.cartCount

                        );

                if (headerBadge) {

                    headerBadge.textContent =

                        display;

                }

                if (mobileBadge) {

                    mobileBadge.textContent =

                        display;

                }

            }

            /* =====================================================

               NAVIGATION ACTIVE

               ===================================================== */

            function setupMobileNavigation() {

                const items =

                    document.querySelectorAll(

                        "[data-mobile-nav]"

                    );

                items.forEach(

                    item => {

                        item.classList.remove(

                            "is-active"

                        );

                    }

                );

                /*

                 * La fiche produit appartient à l'espace

                 * marketplace. Accueil reste l'entrée principale.

                 */

                const home =

                    document.querySelector(

                        "[data-mobile-nav='home']"

                    );

                if (home) {

                    home.classList.add(

                        "is-active"

                    );

                }

            }

            /* =====================================================

               MENU

               ===================================================== */

            function setupMenu() {

                const button =

                    document.getElementById(

                        "menuButton"

                    );

                const overlay =

                    document.getElementById(

                        "menuOverlay"

                    );

                const close =

                    document.getElementById(

                        "menuClose"

                    );

                if (

                    !button ||

                    !overlay ||

                    !close

                ) {

                    return;

                }

                function openMenu() {

                    overlay.classList.add(

                        "is-open"

                    );

                    overlay.setAttribute(

                        "aria-hidden",

                        "false"

                    );

                    button.setAttribute(

                        "aria-expanded",

                        "true"

                    );

                    document.body.style.overflow =

                        "hidden";

                }

                function closeMenu() {

                    overlay.classList.remove(

                        "is-open"

                    );

                    overlay.setAttribute(

                        "aria-hidden",

                        "true"

                    );

                    button.setAttribute(

                        "aria-expanded",

                        "false"

                    );

                    document.body.style.overflow =

                        "";

                }

                button.addEventListener(

                    "click",

                    openMenu

                );

                close.addEventListener(

                    "click",

                    closeMenu

                );

                overlay.addEventListener(

                    "click",

                    event => {

                        if (

                            event.target ===

                            overlay

                        ) {

                            closeMenu();

                        }

                    }

                );

                overlay

                    .querySelectorAll(

                        ".mb-menu-link"

                    )

                    .forEach(

                        link => {

                            link.addEventListener(

                                "click",

                                closeMenu

                            );

                        }

                    );

                document.addEventListener(

                    "keydown",

                    event => {

                        if (

                            event.key ===

                            "Escape"

                        ) {

                            closeMenu();

                        }

                    }

                );

            }

            /* =====================================================

               BOUTON RETOUR

               ===================================================== */

            function setupBackButton() {

                const button =

                    document.getElementById(

                        "backButton"

                    );

                if (!button) {

                    return;

                }

                button.addEventListener(

                    "click",

                    () => {

                        /*

                         * S'il existe une vraie page précédente,

                         * on revient en arrière.

                         */

                        if (

                            window.history.length >

                            1

                        ) {

                            window.history.back();

                            return;

                        }

                        /*

                         * Sinon retour propre à l'accueil.

                         */

                        window.location.href =

                            "index.html";

                    }

                );

            }

            /* =====================================================

               IMAGE DE SECOURS

               ===================================================== */

            function setupGlobalImageFallback() {

                document.addEventListener(

                    "error",

                    event => {

                        const image =

                            event.target;

                        if (

                            image instanceof

                            HTMLImageElement

                        ) {

                            if (

                                image.dataset

                                    .fallbackApplied

                            ) {

                                return;

                            }

                            image.dataset

                                .fallbackApplied =

                                "true";

                            image.src =

                                FALLBACK_IMAGE;

                        }

                    },

                    true

                );

            }

            /* =====================================================

               INITIALISATION

               ===================================================== */

            async function init() {

                setupMenu();

                setupBackButton();

                setupMobileNavigation();

                setupGlobalImageFallback();

                updateCartBadges();

                const productId =

                    getProductId();

                if (

                    !productId ||

                    !isValidUUID(

                        productId

                    )

                ) {

                    renderError(

                        "Produit introuvable",

                        "Le lien du produit est invalide."

                    );

                    return;

                }

                try {

                    /*

                     * Récupération réelle du produit.

                     * Aucun faux écran de chargement.

                     */

                    const product =

                        await fetchProduct(

                            productId

                        );

                    if (!product) {

                        renderError(

                            "Produit introuvable",

                            "Ce produit n'est plus disponible ou n'existe pas."

                        );

                        return;

                    }

                    state.product =

                        product;

                    /*

                     * Les données complémentaires

                     * ne doivent jamais empêcher

                     * l'affichage du produit.

                     */

                    const [

                        seller,

                        shop,

                        category,

                        reviews

                    ] =

                        await Promise.all([

                            fetchSeller(

                                product.seller_id

                            ),

                            fetchShop(

                                product.shop_id

                            ),

                            fetchCategory(

                                product.category_id

                            ),

                            fetchReviews(

                                product.id

                            )

                        ]);

                    state.seller =

                        seller;

                    state.shop =

                        shop;

                    state.category =

                        category;

                    state.reviews =

                        Array.isArray(

                            reviews

                        )

                            ? reviews

                            : [];

                    renderProduct();

                    document.title =

                        `${product.name || "Produit"} | Market Bouaké`;

                } catch (error) {

                    console.error(

                        "Market Bouaké — erreur fiche produit :",

                        error

                    );

                    renderError(

                        "Impossible d'afficher ce produit",

                        "Une erreur est survenue lors de la récupération des informations."

                    );

                }

            }

            /* =====================================================

               SYNCHRONISATION DU PANIER

               ===================================================== */

            window.addEventListener(

                "storage",

                () => {

                    updateCartBadges();

                }

            );

            window.addEventListener(

                "pageshow",

                () => {

                    updateCartBadges();

                }

            );

            /* =====================================================

               LANCEMENT

               ===================================================== */

            if (

                document.readyState ===

                "loading"

            ) {

                document.addEventListener(

                    "DOMContentLoaded",

                    init,

                    {

                        once: true

                    }

                );

            } else {

                init();

            }

        })();

    </script>

</body>

</html>
