}

    color:white;

}

.menu-button:hover{

    background:rgba(255,255,255,.12);

}

.brand{

    display:flex;

    align-items:center;

    gap:10px;

    font-size:20px;

    font-weight:bold;

}

.logo{

    width:42px;

    height:42px;

    border-radius:12px;

}

.admin-label{

.sidebar{

}

.sidebar.open{left:0}

.sidebar-header{

    height:70px;

    background:#0b6b43;

    color:white;

}

.sidebar-title{

    font-weight:bold;

    font-size:18px;

}

.close-menu{

    background:transparent;

    border:none;

    color:white;

    font-size:28px;

}

.menu-list{

    padding:15px 10px;

}

.menu-item{

    width:100%;

    gap:12px;

}

.overlay.show{display:block}

.container{

}

.page-title{

    font-size:28px;

}

.page-subtitle{

.stats-grid{

.stat-card{

.stat-icon{

.section-description{

}

}

.btn-danger{

}

.btn-warning{

}

}

}

.table-wrapper{

table{

th,td{

}

.badge-approved{

}

.badge-rejected,

}

.badge-active{

    background:#e4f4ec;

}

.badge-neutral{

}

.empty{

.loading-small{

.modal-close{

.detail-grid{

textarea.form-control{

#loading{

<script>

/* =========================================================

   CONFIGURATION

========================================================= */

const SUPABASE_URL =

    "https://qgdxxrnsiyzbacxxfdrg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =

    "sb_publishable_QE2in_ocTQQDEt0HW9wSCg_PKSzqo7N";

const supabaseClient =

    window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_PUBLISHABLE_KEY

    );

/* =========================================================

   ÉLÉMENTS

========================================================= */

const sidebar =

    document.getElementById("sidebar");

const overlay =

    document.getElementById("overlay");

const menuButton =

    document.getElementById("menuButton");

const closeMenu =

    document.getElementById("closeMenu");

const loading =

    document.getElementById("loading");

const adminContent =

    document.getElementById("adminContent");

const pageContent =

    document.getElementById("pageContent");

const message =

    document.getElementById("message");

const modal =

    document.getElementById("modal");

const modalTitle =

    document.getElementById("modalTitle");

const modalContent =

    document.getElementById("modalContent");

const modalClose =

    document.getElementById("modalClose");

/* =========================================================

   UTILITAIRES

========================================================= */

function escapeHTML(value){

    if(value === null || value === undefined){

        return "";

    }

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}

function showMessage(text,color="#0b6b43"){

    message.textContent = text;

    message.style.color = color;

    setTimeout(function(){

        if(message.textContent === text){

            message.textContent = "";

        }

    },5000);

}

function formatDate(value){

    if(!value){

        return "—";

    }

    try{

        return new Date(value).toLocaleString(

            "fr-FR",

            {

                dateStyle:"short",

                timeStyle:"short"

            }

        );

    }catch(e){

        return value;

    }

}

function money(value){

    const number =

        Number(value || 0);

    return number.toLocaleString(

        "fr-FR"

    ) + " FCFA";

}

function whatsapp(phone,messageText){

    if(!phone){

        return "";

    }

    let clean =

        String(phone).replace(/[^\d]/g,"");

    if(clean.length === 10 && clean.startsWith("0")){

        clean = "225" + clean;

    }

    if(clean.startsWith("225") === false){

        clean = "225" + clean;

    }

    const url =

        "https://wa.me/" +

        clean +

        "?text=" +

        encodeURIComponent(messageText || "");

    return `

        <a

            class="btn btn-whatsapp whatsapp-link"

            href="${url}"

            target="_blank"

            rel="noopener"

        >

            WhatsApp

        </a>

    `;

}

function openModal(title,content){

    modalTitle.textContent = title;

    modalContent.innerHTML = content;

    modal.classList.add("show");

}

function closeModal(){

    modal.classList.remove("show");

}

modalClose.addEventListener(

    "click",

    closeModal

);

modal.addEventListener(

    "click",

    function(event){

        if(event.target === modal){

            closeModal();

        }

    }

);

/* =========================================================

   MENU

========================================================= */

function openMenu(){

    sidebar.classList.add("open");

    overlay.classList.add("show");

}

function closeSidebar(){

    sidebar.classList.remove("open");

    overlay.classList.remove("show");

}

menuButton.addEventListener(

    "click",

    openMenu

);

closeMenu.addEventListener(

    "click",

    closeSidebar

);

overlay.addEventListener(

    "click",

    closeSidebar

);

/* =========================================================

   VÉRIFICATION ADMIN

========================================================= */

async function checkAdminAccess(){

    try{

        const {

            data:sessionData,

            error:sessionError

        } =

        await supabaseClient.auth.getSession();

        if(sessionError){

            throw sessionError;

        }

        const session =

            sessionData.session;

        if(!session || !session.user){

            window.location.href =

                "connexion.html";

            return;

        }

        const user =

            session.user;

        const {

            data:profile,

            error:profileError

        } =

        await supabaseClient

            .from("profiles")

            .select(

                "id,first_name,last_name,email,phone,role"

            )

            .eq("id",user.id)

            .single();

        if(profileError){

            throw profileError;

        }

        if(!profile || profile.role !== "admin"){

            alert(

                "Accès refusé. Cette page est réservée à l'administration."

            );

            window.location.href =

                "compte.html";

            return;

        }

        loading.style.display =

            "none";

        adminContent.classList.remove(

            "hidden"

        );

        await loadSection("dashboard");

    }catch(error){

        console.error(error);

        loading.innerHTML =

            "Impossible de charger l'espace administrateur.";

    }

}

/* =========================================================

   MENU DES SECTIONS

========================================================= */

document

.querySelectorAll(".menu-item[data-section]")

.forEach(function(item){

    item.addEventListener(

        "click",

        async function(){

            document

            .querySelectorAll(".menu-item[data-section]")

            .forEach(function(button){

                button.classList.remove("active");

            });

            item.classList.add("active");

            closeSidebar();

            await loadSection(

                item.dataset.section

            );

        }

    );

});

/* =========================================================

   CHARGEMENT SECTION

========================================================= */

async function loadSection(section){

    pageContent.innerHTML =

        '<div class="section"><div class="loading-small">Chargement...</div></div>';

    try{

        if(section === "dashboard")

            await renderDashboard();

        else if(section === "users")

            await renderUsers();

        else if(section === "seller-requests")

            await renderSellerRequests();

        else if(section === "products")

            await renderProducts();

        else if(section === "orders")

            await renderOrders();

        else if(section === "problems")

            await renderProblems();

        else if(section === "reviews")

            await renderReviews();

        else if(section === "categories")

            await renderCategories();

        else if(section === "shops")

            await renderShops();

        else if(section === "delivery")

            await renderDelivery();

        else if(section === "notifications")

            await renderNotifications();

        else if(section === "badges")

            await renderBadges();

        else if(section === "statistics")

            await renderStatistics();

        else if(section === "settings")

            await renderSettings();

    }catch(error){

        console.error(error);

        pageContent.innerHTML = `

            <div class="section">

                <div class="notice notice-warning">

                    Impossible de charger cette section.

                    <br><br>

                    ${escapeHTML(error.message || "Erreur Supabase")}

                </div>

            </div>

        `;

    }

}

/* =========================================================

   TABLEAU DE BORD

========================================================= */

async function renderDashboard(){

    const tables = [

        "profiles",

        "seller_requests",

        "products",

        "orders",

        "problems",

        "reviews",

        "shops"

    ];

    const counts = {};

    for(const table of tables){

        const {

            count,

            error

        } =

        await supabaseClient

            .from(table)

            .select(

                "id",

                {

                    count:"exact",

                    head:true

                }

            );

        counts[table] =

            error ? "—" : (count || 0);

    }

    pageContent.innerHTML = `

        <h1 class="page-title">

            Tableau de bord

        </h1>

        <p class="page-subtitle">

            Vue générale de Market Bouaké.

        </p>

        <div class="stats-grid">

            <div class="stat-card">

                <div class="stat-icon">👥</div>

                <div class="stat-label">Utilisateurs</div>

                <div class="stat-value">${counts.profiles}</div>

            </div>

            <div class="stat-card">

                <div class="stat-icon">🏪</div>

                <div class="stat-label">Demandes vendeurs</div>

                <div class="stat-value">${counts.seller_requests}</div>

            </div>

            <div class="stat-card">

                <div class="stat-icon">📦</div>

                <div class="stat-label">Produits</div>

                <div class="stat-value">${counts.products}</div>

            </div>

            <div class="stat-card">

                <div class="stat-icon">🛒</div>

                <div class="stat-label">Commandes</div>

                <div class="stat-value">${counts.orders}</div>

            </div>

            <div class="stat-card">

                <div class="stat-icon">⚠️</div>

                <div class="stat-label">Problèmes</div>

                <div class="stat-value">${counts.problems}</div>

            </div>

            <div class="stat-card">

                <div class="stat-icon">⭐</div>

                <div class="stat-label">Avis</div>

                <div class="stat-value">${counts.reviews}</div>

            </div>

            <div class="stat-card">

                <div class="stat-icon">🏪</div>

                <div class="stat-label">Boutiques</div>

                <div class="stat-value">${counts.shops}</div>

            </div>

        </div>

        <div class="section">

            <h2>⚡ Actions rapides</h2>

            <div class="toolbar">

                <button

                    class="btn btn-primary"

                    onclick="loadSection('seller-requests')"

                >

                    🏪 Voir les demandes vendeurs

                </button>

                <button

                    class="btn btn-secondary"

                    onclick="loadSection('users')"

                >

                    👥 Voir les utilisateurs

                </button>

                <button

                    class="btn btn-secondary"

                    onclick="loadSection('orders')"

                >

                    🛒 Voir les commandes

                </button>

                <button

                    class="btn btn-secondary"

                    onclick="loadSection('problems')"

                >

                    ⚠️ Voir les problèmes

                </button>

            </div>

        </div>

    `;

}

/* =========================================================

   UTILISATEURS

========================================================= */

async function renderUsers(){

    const {

        data,

        error

    } =

    await supabaseClient

        .from("profiles")

        .select("*")

        .order("created_at",{ascending:false});

    if(error){

        throw error;

    }

    const rows =

        data || [];

    pageContent.innerHTML = `

        <h1 class="page-title">

            👥 Utilisateurs

        </h1>

        <p class="page-subtitle">

            Gestion des comptes acheteurs, vendeurs et administrateurs.

        </p>

        <div class="section">

            <div class="toolbar">

                <input

                    class="search"

                    id="userSearch"

                    placeholder="Rechercher par nom, email ou téléphone..."

                >

                <button

                    class="btn btn-primary"

                    onclick="renderUsers()"

                >

                    🔄 Actualiser

                </button>

            </div>

            <div id="usersTable"></div>

        </div>

    `;

    function drawUsers(){

        const search =

            (

                document.getElementById("userSearch").value

                || ""

            ).toLowerCase();

        const filtered =

            rows.filter(function(user){

/* =========================================================

========================================================= */

async function approveSeller(requestId,userId){

    if(!confirm(

        "Voulez-vous accepter cette demande vendeur ?"

    )){

        return;

    }

    try{

        const {

            error:requestError

        } =

        await supabaseClient

            .from("seller_requests")

            .update({

                status:"approved",

                admin_note:null,

                updated_at:new Date().toISOString()

            })

            .eq("id",requestId);

        if(requestError){

            throw requestError;

        }

        const {

            error:profileError

        } =

        await supabaseClient

            .from("profiles")

            .update({

                role:"seller",

                seller_status:"approved",

                updated_at:new Date().toISOString()

            })

            .eq("id",userId);

        if(profileError){

            throw profileError;

        }

        const {

            error:shopError

        } =

        await supabaseClient

            .from("shops")

            .insert({

                user_id:userId

            });

        if(shopError){

            console.warn(

                "Création boutique :",

                shopError

            );

        }

        const {

            error:notificationError

        } =

        await supabaseClient

            .from("notifications")

            .insert({

                user_id:userId,

                title:"Demande vendeur acceptée",

                message:"Félicitations ! Votre demande vendeur a été acceptée. Votre espace vendeur est maintenant disponible.",

                type:"seller_approved",

                related_id:requestId

            });

        if(notificationError){

            console.warn(

                "Notification :",

                notificationError

            );

        }

        showMessage(

            "La demande vendeur a été acceptée."

        );

        await renderSellerRequests();

    }catch(error){

        console.error(error);

        showMessage(

            "Impossible d'accepter la demande : " +

            (error.message || "Erreur"),

            "#c62828"

        );

    }

}

async function rejectSeller(requestId,userId){

    const note =

        prompt(

            "Motif du refus (facultatif) :"

        );

    if(note === null){

        return;

    }

    try{

        const {

            error:requestError

        } =

        await supabaseClient

            .from("seller_requests")

            .update({

                status:"rejected",

                admin_note:note || null,

                updated_at:new Date().toISOString()

            })

            .eq("id",requestId);

        if(requestError){

            throw requestError;

        }

        const {

            error:profileError

        } =

        await supabaseClient

            .from("profiles")

            .update({

                role:"buyer",

                seller_status:"rejected",

                updated_at:new Date().toISOString()

            })

            .eq("id",userId);

        if(profileError){

            throw profileError;

        }

        const {

            error:notificationError

        } =

        await supabaseClient

            .from("notifications")

            .insert({

                user_id:userId,

                title:"Demande vendeur refusée",

                message:

                    "Votre demande vendeur a été refusée." +

        if(notificationError){

        }

        showMessage(

        );

        await renderSellerRequests();

    }catch(error){

        console.error(error);

        showMessage(

            "Impossible de refuser la demande : " +

            "#c62828"

        );

    }

async function renderProblems(){

    const {

        data,

        error

    } =

    await supabaseClient

        .from("problems")

        .select("*")

        .order("created_at",{ascending:false});

    if(error){

        throw error;

    }

    const problems =

        data || [];

    pageContent.innerHTML = `

        <h1 class="page-title">⚠️ Problèmes</h1>

        <p class="page-subtitle">

            Gestion des problèmes signalés par les utilisateurs.

        </p>

        <div class="section">

            <div class="toolbar">

                <select class="select" id="problemStatus">

                    <option value="open">open</option>

                    onclick="renderProblems()"

            <div id="problemsTable"></div>

        </div>

    function draw(){

        const status =

            document.getElementById("problemStatus").value;

            problems.filter(function(problem){

                    status === "all"

                '<div class="empty">Aucun problème.</div>';

                        </tr>

                                    <td>

                                        <strong>

                                            ${escapeHTML(problem.reason)}

                                    </td>

                                    <td>

/* =========================================================

async function resolveProblem(id){

    const {

        error

    } =

    await supabaseClient

        .from("problems")

        .update({

            status:"resolved",

            updated_at:new Date().toISOString()

        })

        .eq("id",id);

    if(error){

        showMessage(

            "Impossible de résoudre le problème : " + error.message,

            "#c62828"

        );

        return;

    }

    showMessage(

        "Problème marqué comme résolu."

    );

    await renderProblems();

}

/* =========================================================

========================================================= */

async function respondProblem(id){

    const response =

        document.getElementById("adminResponse").value.trim();

    if(!response){

        alert(

            "Veuillez écrire une réponse."

        );

        return;

    }

    const {

        error

    } =

    await supabaseClient

        .from("problems")

        .update({

            admin_response:response,

            status:"resolved",

            updated_at:new Date().toISOString()

        })

        .eq("id",id);

    if(error){

        showMessage(

            "Impossible d'enregistrer la réponse : " + error.message,

            "#c62828"

        );

        return;

    }

    closeModal();

    showMessage(

        "Réponse enregistrée et problème résolu."

    );

    await renderProblems();

}

                id="categoryDescription"

        >

            💾 Enregistrer

        </button>

async function saveCategory(id){

    const name =

        document.getElementById("categoryName")

            .value.trim();

    const description =

        document.getElementById("categoryDescription")

            .value.trim();

    if(!name){

        alert("Le nom est obligatoire.");

        return;

    }

    let result;

    if(id){

        result =

            await supabaseClient

                .from("categories")

                .update({

                    name:name,

                    description:description || null,

                    updated_at:new Date().toISOString()

                })

                .eq("id",id);

    }else{

        result =

            await supabaseClient

                .from("categories")

                .insert({

                    name:name,

                    description:description || null

                });

    }

    if(result.error){

        showMessage(

            result.error.message,

            "#c62828"

        );

        return;

    }

    closeModal();

    showMessage(

        "Catégorie enregistrée."

    );

    await renderCategories();

}

        );

async function toggleDelivery(id,current){

function openNotificationForm(){

    openModal(

        "Envoyer une notification",

        `

        <div class="notice notice-info">

            La notification sera enregistrée pour l'utilisateur indiqué.

        </div>

        <div class="form-group">

            <label>ID utilisateur</label>

            <input

                class="form-control"

                id="notificationUser"

                placeholder="UUID de l'utilisateur"

            >

        </div>

        <div class="form-group">

            <label>Titre</label>

            <input

                class="form-control"

                id="notificationTitle"

            >

        </div>

        <div class="form-group">

            <label>Message</label>

            <textarea

                class="form-control"

                id="notificationMessage"

            ></textarea>

        </div>

        <div class="form-group">

            <label>Type</label>

            <input

                class="form-control"

                id="notificationType"

                value="general"

            >

        </div>

        <button

            class="btn btn-primary"

            onclick="sendNotification()"

        >

            🔔 Envoyer

        </button>

        `

    );

}

async function sendNotification(){

    const userId =

        document.getElementById("notificationUser")

            .value.trim();

    const title =

        document.getElementById("notificationTitle")

            .value.trim();

    const msg =

        document.getElementById("notificationMessage")

            .value.trim();

    const type =

        document.getElementById("notificationType")

            .value.trim() || "general";

    if(!userId || !title || !msg){

        alert(

            "Veuillez remplir les champs obligatoires."

        );

        return;

    }

    const {

        error

    } =

    await supabaseClient

        .from("notifications")

        .insert({

            user_id:userId,

            title:title,

            message:msg,

            type:type

        });

    if(error){

        showMessage(

            error.message,

            "#c62828"

        );

        return;

    }

    closeModal();

    showMessage(

        "Notification envoyée."

    );

    await renderNotifications();

}

function openBadgeForm(badge=null){

    openModal(

        badge

        ?

        "Modifier le badge"

        :

        "Nouveau badge",

        `

        <div class="form-group">

            <label>Nom</label>

            <input

                class="form-control"

                id="badgeName"

                value="${escapeHTML(badge ? badge.name : "")}"

            >

        </div>

        <div class="form-group">

            <label>Description</label>

            <textarea

                class="form-control"

                id="badgeDescription"

            >${escapeHTML(badge ? badge.description || "" : "")}</textarea>

        </div>

        <div class="form-group">

            <label>URL de l'icône</label>

            <input

                class="form-control"

                id="badgeIcon"

                value="${escapeHTML(badge ? badge.icon_url || "" : "")}"

                placeholder="https://..."

            >

        </div>

        <button

            class="btn btn-primary"

            onclick="saveBadge('${badge ? badge.id : ""}')"

        >

            💾 Enregistrer

        </button>

        `

    );

}

async function saveBadge(id){

    const name =

        document.getElementById("badgeName")

            .value.trim();

    const description =

        document.getElementById("badgeDescription")

            .value.trim();

    const icon =

        document.getElementById("badgeIcon")

            .value.trim();

    if(!name){

        alert(

            "Le nom est obligatoire."

        );

        return;

    }

    let result;

    if(id){

        result =

            await supabaseClient

                .from("badges")

                .update({

                    name:name,

                    description:description || null,

                    icon_url:icon || null

                })

                .eq("id",id);

    }else{

        result =

            await supabaseClient

                .from("badges")

                .insert({

                    name:name,

                    description:description || null,

                    icon_url:icon || null

                });

    }

    if(result.error){

        showMessage(

            result.error.message,

            "#c62828"

        );

        return;

    }

    closeModal();

    showMessage(

        "Badge enregistré."

    );

    await renderBadges();

}

async function toggleBadge(id,current){

    const {

        error

    } =

    await supabaseClient

        .from("badges")

        .update({

            is_active:!current

        })

        .eq("id",id);

    if(error){

        showMessage(

            error.message,

            "#c62828"

        );

        return;

    }

    await renderBadges();

}

async function renderStatistics(){

    const tables = [

        "profiles",

        "seller_requests",

        "products",

        "orders",

        "order_items",

        "reviews",

        "problems",

        "shops",

        "favorites",

        "notifications",

        "user_badges"

    ];

    const results = {};

    for(const table of tables){

        const {

            count,

            error

        } =

        await supabaseClient

            .from(table)

            .select(

                "id",

                {

                    count:"exact",

                    head:true

                }

            );

        results[table] =

            error ? 0 : (count || 0);

    }

    pageContent.innerHTML = `

        <h1 class="page-title">📊 Statistiques</h1>

        <p class="page-subtitle">

            Indicateurs réels enregistrés dans Supabase.

        </p>

        <div class="stats-grid">

            ${Object.entries(results).map(function(item){

                const labels = {

                    profiles:"Utilisateurs",

                    seller_requests:"Demandes vendeurs",

                    products:"Produits",

                    orders:"Commandes",

                    order_items:"Articles commandés",

                    reviews:"Avis",

                    problems:"Problèmes",

                    shops:"Boutiques",

                    favorites:"Favoris",

                    notifications:"Notifications",

                    user_badges:"Badges attribués"

                };

                return `

                    <div class="stat-card">

                        <div class="stat-icon">

                            📊

                        </div>

                        <div class="stat-label">

                            ${labels[item[0]] || item[0]}

                        </div>

                        <div class="stat-value">

                            ${item[1]}

                        </div>

                    </div>

                `;

            }).join("")}

        </div>

    `;

}
