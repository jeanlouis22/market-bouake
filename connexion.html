<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion | Market Bouaké</title>

    <style>

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }

        body {

            font-family: Arial, sans-serif;

            background: #f5f7f6;

            color: #17211b;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }

        .container {

            width: 100%;

            max-width: 450px;

            background: white;

            border-radius: 18px;

            padding: 30px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);

        }

        .logo {

            text-align: center;

            margin-bottom: 25px;

        }

        .logo-icon {

            width: 65px;

            height: 65px;

            margin: auto;

            border-radius: 18px;

            background: #0b6b43;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

        }

        h1 {

            text-align: center;

            margin-top: 12px;

            font-size: 26px;

        }

        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-top: 8px;

            margin-bottom: 25px;

        }

        .form-group {

            margin-bottom: 17px;

        }

        label {

            display: block;

            font-weight: 600;

            margin-bottom: 7px;

        }

        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d6ddd9;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

        }

        input:focus {

            border-color: #0b6b43;

        }

        button {

            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 14px;

            background: #0b6b43;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;

        }

        button:hover {

            opacity: 0.92;

        }

        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }

        .forgot-password {

            display: block;

            text-align: right;

            margin-top: 10px;

            color: #0b6b43;

            font-size: 14px;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;

        }

        .forgot-password:hover {

            text-decoration: underline;

        }

        #message {

            margin-top: 18px;

            text-align: center;

            font-weight: 600;

            line-height: 1.5;

        }

        .register {

            text-align: center;

            margin-top: 22px;

            color: #6b7280;

        }

        .register a {

            color: #0b6b43;

            font-weight: bold;

            text-decoration: none;

        }

        .back {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #6b7280;

            text-decoration: none;

            font-size: 14px;

        }

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.45);

            justify-content: center;

            align-items: center;

            padding: 20px;

            z-index: 1000;

        }

        .modal.active {

            display: flex;

        }

        .modal-content {

            width: 100%;

            max-width: 420px;

            background: white;

            border-radius: 18px;

            padding: 25px;

            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18);

        }

        .modal-content h2 {

            margin-bottom: 10px;

        }

        .modal-content p {

            color: #6b7280;

            line-height: 1.5;

            margin-bottom: 18px;

        }

        .modal-actions {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-top: 10px;

        }

        .cancel-button {

            background: #edf2ef;

            color: #17211b;

        }

        #resetMessage {

            margin-top: 15px;

            text-align: center;

            font-weight: 600;

            line-height: 1.5;

        }

        @media (max-width: 500px) {

            .container {

                padding: 22px;

            }

            .modal-actions {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">

            <div class="logo-icon">

                🛒

            </div>

            <h1>

                Market Bouaké

            </h1>

        </div>

        <p class="subtitle">

            Connectez-vous à votre compte

        </p>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">

                    Email

                </label>

                <input

                    type="email"

                    id="email"

                    placeholder="exemple@email.com"

                    autocomplete="email"

                    required

                >

            </div>

            <div class="form-group">

                <label for="password">

                    Mot de passe

                </label>

                <input

                    type="password"

                    id="password"

                    placeholder="Votre mot de passe"

                    autocomplete="current-password"

                    required

                >

                <a

                    href="#"

                    id="forgotPassword"

                    class="forgot-password"

                >

                    Mot de passe oublié ?

                </a>

            </div>

            <button

                type="submit"

                id="loginButton"

            >

                Se connecter

            </button>

        </form>

        <p id="message"></p>

        <div class="register">

            Vous n'avez pas encore de compte ?

            <a href="inscription.html">

                Créer un compte

            </a>

        </div>

        <a

            href="index.html"

            class="back"

        >

            ← Retour à Market Bouaké

        </a>

    </div>

    <!-- ========================================= -->

    <!-- MODALE MOT DE PASSE OUBLIÉ -->

    <!-- ========================================= -->

    <div

        id="resetModal"

        class="modal"

    >

        <div class="modal-content">

            <h2>

                🔐 Mot de passe oublié ?

            </h2>

            <p>

                Entrez l'adresse e-mail associée à votre compte.

                Nous vous enverrons un lien pour créer un nouveau mot de passe.

            </p>

            <form id="resetForm">

                <div class="form-group">

                    <label for="resetEmail">

                        Adresse e-mail

                    </label>

                    <input

                        type="email"

                        id="resetEmail"

                        placeholder="exemple@email.com"

                        autocomplete="email"

                        required

                    >

                </div>

                <button

                    type="submit"

                    id="resetButton"

                >

                    Envoyer le lien

                </button>

                <div class="modal-actions">

                    <button

                        type="button"

                        id="closeResetModal"

                        class="cancel-button"

                    >

                        Annuler

                    </button>

                </div>

                <p id="resetMessage"></p>

            </form>

        </div>

    </div>

    <!-- ========================================= -->

    <!-- SUPABASE -->

    <!-- ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        // ============================================

        // MARKET BOUAKÉ

        // CONFIGURATION SUPABASE

        // ============================================

        const SUPABASE_URL =

            "https://qgdxxrnsiyzbacxxfdrg.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =

            "sb_publishable_QE2in_ocTQQDEt0HW9wSCg_PKSzqo7N";

        const supabaseClient =

            window.supabase.createClient(

                SUPABASE_URL,

                SUPABASE_PUBLISHABLE_KEY

            );

        // ============================================

        // ÉLÉMENTS

        // ============================================

        const form =

            document.getElementById("loginForm");

        const button =

            document.getElementById("loginButton");

        const message =

            document.getElementById("message");

        const forgotPassword =

            document.getElementById("forgotPassword");

        const resetModal =

            document.getElementById("resetModal");

        const resetForm =

            document.getElementById("resetForm");

        const resetButton =

            document.getElementById("resetButton");

        const resetMessage =

            document.getElementById("resetMessage");

        const closeResetModal =

            document.getElementById("closeResetModal");

        // ============================================

        // OUVRIR MOT DE PASSE OUBLIÉ

        // ============================================

        forgotPassword.addEventListener(

            "click",

            function(event) {

                event.preventDefault();

                const loginEmail =

                    document

                        .getElementById("email")

                        .value

                        .trim();

                if (loginEmail) {

                    document.getElementById("resetEmail").value =

                        loginEmail;

                }

                resetMessage.textContent = "";

                resetMessage.style.color =

                    "#17211b";

                resetModal.classList.add("active");

            }

        );

        // ============================================

        // FERMER LA MODALE

        // ============================================

        closeResetModal.addEventListener(

            "click",

            function() {

                resetModal.classList.remove("active");

            }

        );

        // Fermer en cliquant à l'extérieur

        resetModal.addEventListener(

            "click",

            function(event) {

                if (event.target === resetModal) {

                    resetModal.classList.remove("active");

                }

            }

        );

        // ============================================

        // MOT DE PASSE OUBLIÉ

        // ============================================

        resetForm.addEventListener(

            "submit",

            async function(event) {

                event.preventDefault();

                const email =

                    document

                        .getElementById("resetEmail")

                        .value

                        .trim();

                if (!email) {

                    resetMessage.textContent =

                        "Veuillez entrer votre adresse e-mail.";

                    resetMessage.style.color =

                        "#c62828";

                    return;

                }

                resetButton.disabled = true;

                resetButton.textContent =

                    "Envoi...";

                resetMessage.textContent = "";

                try {

                    /*

                     * L'utilisateur doit configurer

                     * cette page dans les Redirect URLs

                     * de Supabase :

                     *

                     * reset-password.html

                     */

                    const redirectUrl =

                        window.location.origin +

                        window.location.pathname

                            .replace(

                                "connexion.html",

                                "reset-password.html"

                            );

                    const {

                        error

                    } =

                        await supabaseClient.auth

                            .resetPasswordForEmail(

                                email,

                                {

                                    redirectTo:

                                        redirectUrl

                                }

                            );

                    if (error) {

                        console.error(

                            "Erreur récupération mot de passe :",

                            error

                        );

                        throw error;

                    }

                    resetMessage.textContent =

                        "✅ Un lien de récupération a été envoyé à votre adresse e-mail.";

                    resetMessage.style.color =

                        "#0b6b43";

                    resetButton.textContent =

                        "Lien envoyé";

                    setTimeout(

                        function() {

                            resetModal.classList.remove(

                                "active"

                            );

                            resetButton.disabled =

                                false;

                            resetButton.textContent =

                                "Envoyer le lien";

                        },

                        3000

                    );

                }

                catch (error) {

                    console.error(

                        "Erreur mot de passe oublié :",

                        error

                    );

                    resetMessage.textContent =

                        "Impossible d'envoyer le lien. Vérifiez l'adresse e-mail et la configuration Supabase.";

                    resetMessage.style.color =

                        "#c62828";

                    resetButton.disabled =

                        false;

                    resetButton.textContent =

                        "Envoyer le lien";

                }

            }

        );

        // ============================================

        // CONNEXION

        // ============================================

        form.addEventListener(

            "submit",

            async function(event) {

                event.preventDefault();

                const email =

                    document

                        .getElementById("email")

                        .value

                        .trim();

                const password =

                    document

                        .getElementById("password")

                        .value;

                // ========================================

                // VÉRIFICATION

                // ========================================

                if (!email || !password) {

                    message.textContent =

                        "Veuillez remplir tous les champs.";

                    message.style.color =

                        "#c62828";

                    return;

                }

                // ========================================

                // CHARGEMENT

                // ========================================

                button.disabled = true;

                button.textContent =

                    "Connexion...";

                message.textContent = "";

                try {

                    // ====================================

                    // AUTH SUPABASE

                    // ====================================

                    const {

                        data,

                        error

                    } =

                        await supabaseClient.auth

                            .signInWithPassword({

                                email: email,

                                password: password

                            });

                    // ====================================

                    // ERREUR CONNEXION

                    // ====================================

                    if (error) {

                        console.error(

                            "Erreur connexion :",

                            error

                        );

                        message.textContent =

                            "Email ou mot de passe incorrect.";

                        message.style.color =

                            "#c62828";

                        button.disabled =

                            false;

                        button.textContent =

                            "Se connecter";

                        return;

                    }

                    // ====================================

                    // VÉRIFICATION SESSION

                    // ====================================

                    if (

                        !data ||

                        !data.user

                    ) {

                        throw new Error(

                            "Session utilisateur introuvable."

                        );

                    }

                    const user =

                        data.user;

                    // ====================================

                    // RÉCUPÉRER LE PROFIL

                    // ====================================

                    const {

                        data: profile,

                        error: profileError

                    } =

                        await supabaseClient

                            .from("profiles")

                            .select(

                                "id,role,seller_status"

                            )

                            .eq(

                                "id",

                                user.id

                            )

                            .single();

                    if (profileError) {

                        console.error(

                            "Erreur profil :",

                            profileError

                        );

                        /*

                         * La connexion Auth est réussie,

                         * mais le profil doit être accessible

                         * pour déterminer l'espace utilisateur.

                         */

                        await supabaseClient.auth.signOut();

                        throw new Error(

                            "Impossible de charger votre profil."

                        );

                    }

                    if (!profile) {

                        await supabaseClient.auth.signOut();

                        throw new Error(

                            "Profil utilisateur introuvable."

                        );

                    }

                    // ====================================

                    // CONNEXION RÉUSSIE

                    // ====================================

                    message.textContent =

                        "Connexion réussie !";

                    message.style.color =

                        "#0b6b43";

                    // ====================================

                    // DÉTERMINER L'ESPACE

                    // ====================================

                    let destination =

                        "compte.html";

                    // ====================================

                    // ADMIN

                    // ====================================

                    if (

                        profile.role ===

                        "admin"

                    ) {

                        destination =

                            "admin.html";

                    }

                    // ====================================

                    // VENDEUR ACCEPTÉ

                    // ====================================

                    else if (

                        profile.seller_status ===

                        "approved"

                    ) {

                        destination =

                            "vendeur.html";

                    }

                    // ====================================

                    // ACHETEUR

                    // VENDEUR EN ATTENTE

                    // VENDEUR REFUSÉ

                    // ====================================

                    else {

                        destination =

                            "compte.html";

                    }

                    // ====================================

                    // REDIRECTION

                    // ====================================

                    console.log(

                        "Utilisateur connecté :",

                        user.id

                    );

                    console.log(

                        "Rôle :",

                        profile.role

                    );

                    console.log(

                        "Statut vendeur :",

                        profile.seller_status

                    );

                    console.log(

                        "Redirection :",

                        destination

                    );

                    setTimeout(

                        function() {

                            window.location.href =

                                destination;

                        },

                        700

                    );

                }

                catch (error) {

                    console.error(

                        "Erreur inattendue :",

                        error

                    );

                    message.textContent =

                        error.message ||

                        "Une erreur est survenue. Réessayez.";

                    message.style.color =

                        "#c62828";

                    button.disabled =

                        false;

                    button.textContent =

                        "Se connecter";

                }

            }

        );

    </script>

</body>

</html>
