<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscription | Market Bouaké</title>

    <style>

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }

        body {

            font-family: Arial, sans-serif;

            background: #f5f7f6;

            color: #17211b;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }

        .container {

            width: 100%;

            max-width: 480px;

            background: white;

            border-radius: 18px;

            padding: 30px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);

        }

        .logo {

            text-align: center;

            margin-bottom: 25px;

        }

        .logo-icon {

            width: 65px;

            height: 65px;

            margin: auto;

            border-radius: 18px;

            background: #0b6b43;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

        }

        h1 {

            text-align: center;

            margin-top: 12px;

            font-size: 26px;

        }

        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-top: 8px;

            margin-bottom: 25px;

        }

        .form-group {

            margin-bottom: 16px;

        }

        label {

            display: block;

            font-weight: 600;

            margin-bottom: 7px;

        }

        input,

        select {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d6ddd9;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

        }

        input:focus,

        select:focus {

            border-color: #0b6b43;

        }

        .row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

        }

        button {

            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 14px;

            background: #0b6b43;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;

        }

        button:hover {

            opacity: 0.92;

        }

        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }

        #message {

            margin-top: 18px;

            text-align: center;

            font-weight: 600;

            line-height: 1.5;

        }

        .login {

            text-align: center;

            margin-top: 22px;

            color: #6b7280;

        }

        .login a {

            color: #0b6b43;

            font-weight: bold;

            text-decoration: none;

        }

        @media (max-width: 500px) {

            .container {

                padding: 22px;

            }

            .row {

                grid-template-columns: 1fr;

                gap: 0;

            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">

            <div class="logo-icon">🛒</div>

            <h1>Market Bouaké</h1>

        </div>

        <p class="subtitle">

            Créez votre compte acheteur

        </p>

        <form id="signupForm">

            <div class="row">

                <div class="form-group">

                    <label for="firstName">Prénom</label>

                    <input

                        type="text"

                        id="firstName"

                        placeholder="Votre prénom"

                        required

                    >

                </div>

                <div class="form-group">

                    <label for="lastName">Nom</label>

                    <input

                        type="text"

                        id="lastName"

                        placeholder="Votre nom"

                        required

                    >

                </div>

            </div>

            <div class="form-group">

                <label for="email">Email</label>

                <input

                    type="email"

                    id="email"

                    placeholder="exemple@email.com"

                    required

                >

            </div>

            <div class="form-group">

                <label for="gender">Genre</label>

                <select id="gender" required>

                    <option value="">

                        Sélectionner

                    </option>

                    <option value="homme">

                        Homme

                    </option>

                    <option value="femme">

                        Femme

                    </option>

                    <option value="autre">

                        Autre

                    </option>

                </select>

            </div>

            <div class="form-group">

                <label for="birthDate">

                    Date de naissance

                </label>

                <input

                    type="date"

                    id="birthDate"

                    required

                >

            </div>

            <div class="form-group">

                <label for="phone">

                    WhatsApp / Téléphone

                </label>

                <input

                    type="tel"

                    id="phone"

                    placeholder="+225XXXXXXXXXX"

                    required

                >

            </div>

            <div class="form-group">

                <label for="password">

                    Mot de passe

                </label>

                <input

                    type="password"

                    id="password"

                    placeholder="Minimum 6 caractères"

                    minlength="6"

                    required

                >

            </div>

            <div class="form-group">

                <label for="confirmPassword">

                    Confirmer le mot de passe

                </label>

                <input

                    type="password"

                    id="confirmPassword"

                    placeholder="Confirmez votre mot de passe"

                    minlength="6"

                    required

                >

            </div>

            <button

                type="submit"

                id="signupButton"

            >

                Créer mon compte

            </button>

        </form>

        <p id="message"></p>

        <div class="login">

            Vous avez déjà un compte ?

            <a href="connexion.html">

                Se connecter

            </a>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        // ============================================

        // MARKET BOUAKÉ

        // CONNEXION SUPABASE

        // ============================================

        const SUPABASE_URL =

            "https://qgdxxrnsiyzbacxxfdrg.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =

            "sb_publishable_QE2in_ocTQQDEt0HW9wSCg_PKSzqo7N";

        const supabaseClient =

            window.supabase.createClient(

                SUPABASE_URL,

                SUPABASE_PUBLISHABLE_KEY

            );

        // ============================================

        // INSCRIPTION

        // ============================================

        const form =

            document.getElementById("signupForm");

        const button =

            document.getElementById("signupButton");

        const message =

            document.getElementById("message");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const firstName =

                document

                    .getElementById("firstName")

                    .value

                    .trim();

            const lastName =

                document

                    .getElementById("lastName")

                    .value

                    .trim();

            const email =

                document

                    .getElementById("email")

                    .value

                    .trim();

            const gender =

                document

                    .getElementById("gender")

                    .value;

            const birthDate =

                document

                    .getElementById("birthDate")

                    .value;

            const phone =

                document

                    .getElementById("phone")

                    .value

                    .trim();

            const password =

                document

                    .getElementById("password")

                    .value;

            const confirmPassword =

                document

                    .getElementById("confirmPassword")

                    .value;

            // ============================================

            // VÉRIFICATIONS

            // ============================================

            if (

                !firstName ||

                !lastName ||

                !email ||

                !gender ||

                !birthDate ||

                !phone ||

                !password ||

                !confirmPassword

            ) {

                message.textContent =

                    "Veuillez remplir tous les champs.";

                message.style.color = "#c62828";

                return;

            }

            if (password.length < 6) {

                message.textContent =

                    "Le mot de passe doit contenir au moins 6 caractères.";

                message.style.color = "#c62828";

                return;

            }

            if (password !== confirmPassword) {

                message.textContent =

                    "Les deux mots de passe ne correspondent pas.";

                message.style.color = "#c62828";

                return;

            }

            // Vérification simple du numéro ivoirien

            const phoneRegex =

                /^\+225\d{10}$/;

            if (!phoneRegex.test(phone)) {

                message.textContent =

                    "Le numéro WhatsApp doit être au format +225XXXXXXXXXX.";

                message.style.color = "#c62828";

                return;

            }

            // ============================================

            // BOUTON EN CHARGEMENT

            // ============================================

            button.disabled = true;

            button.textContent =

                "Création du compte...";

            message.textContent =

                "";

            try {

                // ============================================

                // CRÉATION DU COMPTE SUPABASE AUTH

                // ============================================

                const {

                    data,

                    error

                } = await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            first_name: firstName,

                            last_name: lastName,

                            gender: gender,

                            birth_date: birthDate,

                            phone: phone,

                            requested_role: "buyer",

                            role: "buyer"

                        }

                    }

                });

                // ============================================

                // ERREUR

                // ============================================

                if (error) {

                    console.error(

                        "Erreur inscription :",

                        error

                    );

                    message.textContent =

                        "Erreur : " + error.message;

                    message.style.color =

                        "#c62828";

                    button.disabled = false;

                    button.textContent =

                        "Créer mon compte";

                    return;

                }

                // ============================================

                // COMPTE CRÉÉ

                // ============================================

                console.log(

                    "Compte Supabase créé :",

                    data.user

                );

                // ============================================

                // CAS 1 : SESSION IMMÉDIATEMENT DISPONIBLE

                // ============================================

                if (data.session) {

                    message.textContent =

                        "Compte créé avec succès !";

                    message.style.color =

                        "#0b6b43";

                    setTimeout(function() {

                        window.location.href =

                            "compte.html";

                    }, 1000);

                    return;

                }

                // ============================================

                // CAS 2 : CONFIRMATION EMAIL ACTIVÉE

                // ============================================

                message.textContent =

                    "Compte créé ! Vérifiez votre adresse email pour confirmer votre compte.";

                message.style.color =

                    "#0b6b43";

                button.disabled = false;

                button.textContent =

                    "Compte créé";

            } catch (error) {

                console.error(

                    "Erreur inattendue :",

                    error

                );

                message.textContent =

                    "Une erreur est survenue. Réessayez.";

                message.style.color =

                    "#c62828";

                button.disabled = false;

                button.textContent =

                    "Créer mon compte";

            }

        });

    </script>

</body>

</html>
